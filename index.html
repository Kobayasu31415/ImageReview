<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImageReview</title>
<style>
:root{
 --bg:#f1f3ef; --surface:#fff; --surface-2:#fafaf8; --sunken:#e6eae3;
 --ink:#1c2a27; --ink-mid:#55655e; --ink-soft:#8a978f;
 --line:#e0e5dd; --line-strong:#c7d0c5;
 --brand:#1d4c42; --brand-tint:#e9f1ec;
 --accent:#d08a2c; --danger:#a8323a;
 --r:10px; --r-sm:7px;
 --shadow:0 1px 2px rgba(20,40,34,.05),0 8px 20px -14px rgba(20,40,34,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button,select{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);padding:7px 13px;border-radius:var(--r-sm);cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
button:disabled{opacity:.4;cursor:default}
:is(button,select,input,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- header ---- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 24px;background:var(--brand);color:#fff}
h1{font-size:16px;font-weight:600;letter-spacing:.05em;margin-right:auto;display:flex;align-items:center;gap:10px}
h1 .mark{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#f3c178}
h1 .mark svg{width:15px;height:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
header button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#fff}
header button:hover:not(:disabled){background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff}
#pdf{background:var(--accent);border-color:var(--accent);color:#2d1d05;font-weight:600}
#pdf:hover:not(:disabled){background:#e39a37;border-color:#e39a37;color:#2d1d05}

/* ---- toolbar ---- */
nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
nav label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-mid)}
nav select{padding:6px 9px;font-size:14px}
.seg{display:flex;gap:3px;padding:3px;background:var(--sunken);border-radius:9px}
.seg button{border:0;background:transparent;color:var(--ink-mid);padding:6px 15px;border-radius:7px;font-size:14px}
.seg button:hover:not([aria-pressed=true]){background:rgba(255,255,255,.7);color:var(--brand)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(20,40,34,.18)}
input[type=color]{width:36px;height:28px;padding:0;border:1px solid var(--line-strong);border-radius:6px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
#status{margin-left:auto;font-size:13px;color:var(--brand);background:var(--brand-tint);padding:5px 12px;border-radius:999px;max-width:42ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status:empty{display:none}

/* ---- canvas ---- */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start;min-height:65vh}
section{min-width:0;padding:22px 24px}
#viewport{overflow:auto;max-height:74vh;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 4px rgba(20,40,34,.08)}
#viewport::-webkit-scrollbar{width:12px;height:12px}
#viewport::-webkit-scrollbar-thumb{background:#b5c0b3;border:3px solid var(--sunken);border-radius:999px}
#viewport::-webkit-scrollbar-thumb:hover{background:#97a695}
#board{display:block;width:100%;height:auto;background:#fff;touch-action:none;user-select:none;cursor:crosshair}
#empty{padding:76px 24px;text-align:center}
#empty .icon{width:52px;height:52px;color:var(--line-strong);margin-bottom:14px}
#empty .lead{font-size:15px;font-weight:600;color:var(--ink-mid)}
#empty .sub{margin-top:6px;font-size:13px;color:var(--ink-soft)}
#help{margin-top:12px;min-height:1.6em;font-size:13px;color:var(--ink-soft)}

/* ---- notes ---- */
aside{padding:22px 20px 32px;background:var(--surface-2);border-left:1px solid var(--line)}
h2{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ink-soft);display:flex;align-items:center;gap:10px;margin-bottom:14px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
#hint{padding:16px;font-size:13px;line-height:1.7;color:var(--ink-soft);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.note{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px 10px;padding:13px 14px;margin:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.note:hover{border-color:var(--line-strong)}
.note.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint),var(--shadow)}
.num{justify-self:start;padding:3px 11px;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-tint);border-radius:999px}
.note>button{padding:4px 9px;font-size:12px;color:var(--ink-soft);background:transparent;border-color:transparent}
.note>button:hover{color:var(--danger);border-color:var(--danger);background:var(--surface)}
.note>:is(textarea,.printText,.references){grid-column:1/-1}
textarea{display:block;width:100%;min-height:74px;resize:vertical;padding:9px 11px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);transition:background .15s,border-color .15s}
textarea:hover{border-color:var(--line-strong)}
textarea:focus{background:var(--surface);border-color:var(--brand)}
textarea::placeholder{color:#a9b5ae}

/* ---- reference images ---- */
.references{display:flex;flex-wrap:wrap;gap:9px}
.references>button{order:-1;flex:0 0 100%;padding:6px 10px;font-size:12px;color:var(--ink-mid);background:var(--surface-2);border-style:dashed;border-color:var(--line-strong)}
.references>button:hover{color:var(--brand);background:var(--brand-tint);border-color:var(--brand)}
.references figure{flex:0 0 136px;max-width:136px;margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.references img{display:block;width:100%;height:94px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}
.references figcaption{padding:6px 8px 0;font-size:11px;line-height:1.45;color:var(--ink-mid);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.references figure button{display:block;width:100%;margin-top:5px;padding:4px;font-size:11px;color:var(--ink-soft);background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
.references figure button:hover{color:var(--danger);background:#fdf4f4}

.printText,#printTitle{display:none}
[hidden]{display:none!important}
@media(max-width:860px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}header,nav,section,aside{padding-left:16px;padding-right:16px}}

/* ---- print ---- */
@page{size:A4 landscape;margin:10mm}
@media print{
 body{background:#fff;color:#000;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,nav,#help,#empty,#hint,textarea,.note button{display:none!important}
 main,section,aside,#viewport,.note{display:block;padding:0;margin:0;border:0;background:#fff;overflow:visible;max-height:none;box-shadow:none;border-radius:0}
 #printTitle{display:block;margin-bottom:3mm;padding-bottom:2mm;font-size:14pt;font-weight:600;border-bottom:.4pt solid #999;overflow-wrap:anywhere}
 #board{width:100%!important;height:112mm!important;max-width:100%}
 aside{margin-top:4mm!important}
 aside h2{margin-bottom:2mm;font-size:10pt;letter-spacing:.1em;color:#555}
 aside h2::after{background:#bbb}
 .note{margin:0 0 2.5mm!important;padding-bottom:1.5mm!important;border-bottom:.4pt solid #ccc!important;break-inside:avoid}
 .num{padding:0;font-size:10pt;color:#000;background:none}
 .printText{display:inline;margin-left:3mm;white-space:pre-wrap;overflow-wrap:anywhere}
 .references{display:flex;gap:3mm;margin-top:2mm}
 .references:not(:has(figure)){display:none}
 .references figure{flex:0 0 auto;max-width:70mm;background:#fff;border:.4pt solid #ccc;break-inside:avoid}
 .references img{width:auto;height:auto;max-width:70mm;max-height:45mm}
 .references figcaption{display:block;font-size:7pt;-webkit-line-clamp:none}
 .note:has(figure){break-inside:auto}
}
#pdfPicker{border:1px solid #bccbc5;border-radius:12px;max-width:min(90vw,550px);color:inherit}#pdfPicker::backdrop{background:#16352c66}#pdfName{overflow-wrap:anywhere}#pagePreview{margin:10px 0;display:grid;place-items:center;background:#ebeee9;min-height:8em}#pagePreview canvas{max-width:100%;max-height:42vh}#pdfPicker form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#pageNumber{width:5em}
</style>
<header><h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6"/></svg></span>ImageReview</h1><div class="actions"><button id="open">画像・PDFを開く</button><button id="restore">ノートを開く</button><button id="save" disabled>ノート保存</button><button id="pdf" disabled>印刷 / PDF保存</button></div></header>
<input hidden id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,application/pdf,.pdf"><input hidden id="project" type="file" accept=".json">
<nav><div class="seg" role="group" aria-label="描画ツール"><button id="tag" aria-pressed="true">番号タグ</button><button id="brush" aria-pressed="false">ブラシ</button></div><label>色<input type="color" id="ink" value="#c93235"></label><label>太さ<select id="width"><option value="2">細</option><option selected value="4">中</option><option value="8">太</option></select></label><button id="undo" disabled>元に戻す</button><label>表示<select id="zoom"><option value="1">全幅</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><span id="status" role="status"></span></nav>
<main><section><h2 id="printTitle"></h2><div id="viewport"><div id="empty"><svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="9" width="36" height="30" rx="4"/><circle cx="17" cy="20" r="3.5"/><path d="M8 33l10-9 7 6 6-5 9 8"/></svg><p class="lead">修正したい画像・PDFをここにドロップ</p><p class="sub">または「画像・PDFを開く」から選んでください（PNG / JPEG / WebP / GIF / BMP / PDF）</p></div><svg id="board" hidden xmlns="http://www.w3.org/2000/svg" aria-label="修正箇所を指定する画像"></svg></div><p id="help"></p></section><aside><h2>修正指示</h2><p id="hint">画像をクリックして、指示を書く場所を指定します。</p><div id="notes"></div></aside></main>
<dialog id="pdfPicker"><h2>読み込むページを選択</h2><p id="pdfName"></p><div id="pagePreview"></div><form method="dialog"><label>ページ <input id="pageNumber" type="number" min="1" step="1" required><span id="pageCount"></span></label><button value="cancel" formnovalidate>キャンセル</button><button id="usePage" value="use">このページを開く</button></form></dialog>
<script src="vendor/pdfjs-local.js"></script><script src="pdf-import.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), board=$('board'), ns=board.namespaceURI;
let state={name:'',image:'',notes:[],strokes:[]}, height=600, mode='tag', selected=null, gesture=null, dirty=false;
let history=[];
function el(tag,attrs,parent=board){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n}
function changed(){dirty=true;$('status').textContent='未保存'}
function remember(){history.push(structuredClone({notes:state.notes,strokes:state.strokes}));if(history.length>60)history.shift();$('undo').disabled=false}
function stroke(s){const points=s.points.map(p=>p.join(',')).join(' ');if(s.points.length===1)return el('circle',{cx:s.points[0][0],cy:s.points[0][1],r:s.width/2,fill:s.color});return el('polyline',{points,fill:'none',stroke:s.color,'stroke-width':s.width,'stroke-linejoin':'round','stroke-linecap':'round'})}
function draw(){board.replaceChildren();el('image',{href:state.image,width:1000,height});for(const s of state.strokes)stroke(s);
 const r=Math.min(13,height*.055);for(const n of state.notes){const g=el('g',{'data-id':n.id,transform:'translate('+n.x+' '+n.y+')',cursor:'grab'});el('circle',{r,fill:n.color,stroke:'white','stroke-width':2},g);el('text',{'text-anchor':'middle',y:r*.38,fill:'#fff',stroke:'#222','stroke-width':.8,'paint-order':'stroke','font-size':r*1.1,'font-weight':'bold'},g).textContent=n.id}}
const imageData = /^data:image\/(png|jpe?g|gif|webp|bmp);base64,/i;
function referenceArea(note) {
 const area=document.createElement('div');
 area.className='references';
 const picker=document.createElement('input');
 picker.type='file'; picker.accept=$('file').accept; picker.multiple=true; picker.hidden=true;
 const add=document.createElement('button');
 add.textContent='参考画像を追加';
 add.onclick=()=>picker.click();
 async function attach(files) {
  if(!files.length)return;
  try {
   const batch=[];
   for(const file of files){
    const media=await importMedia(file);if(!media)continue;
    if(!imageData.test(media.src))throw Error();
    const image=new Image();image.src=media.src;await image.decode();
    batch.push(media);
   }
   if(!batch.length)return;
   if(!state.notes.includes(note))return;
   remember(); (note.references??=[]).push(...batch); changed(); list();
  } catch { $('status').textContent='参考画像を読み込めませんでした。画像またはパスワード保護のないPDFを選んでください。' }
 }
 picker.onchange=()=>{attach(Array.from(picker.files));picker.value=''};
 area.ondragover=e=>{e.preventDefault();e.stopPropagation()};
 area.ondrop=e=>{e.preventDefault();e.stopPropagation();attach(e.dataTransfer.files)};
 area.append(add,picker);
 for(const [i,ref] of (note.references||[]).entries()) {
  const figure=document.createElement('figure'), img=document.createElement('img');
  img.src=ref.src;img.alt='タグ'+note.id+'の参考画像 '+ref.name;
  const caption=document.createElement('figcaption');caption.textContent=ref.name;
  const remove=document.createElement('button');remove.textContent='画像を外す';
  remove.onclick=()=>{remember();note.references.splice(i,1);changed();list()};
  figure.append(img,caption,remove);area.append(figure);
 }
 return area;
}
function list(){const wrap=$('notes');wrap.replaceChildren();$('hint').hidden=state.notes.length>0;for(const n of state.notes){const row=document.createElement('div');row.className='note'+(selected===n.id?' active':'');const label=document.createElement('span');label.className='num';label.textContent='＃'+n.id;const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{remember();state.notes=state.notes.filter(v=>v!==n);changed();draw();list()};const field=document.createElement('textarea');field.id='note-'+n.id;field.setAttribute('aria-label','修正指示 '+n.id);field.placeholder='修正内容を入力';field.value=n.text;const pr=document.createElement('span');pr.className='printText';pr.textContent=n.text;let saved=false;field.onfocus=()=>{saved=false;selected=n.id;for(const item of wrap.children)item.classList.toggle('active',item===row)};field.oninput=()=>{if(!saved){remember();saved=true}n.text=field.value;pr.textContent=n.text;changed()};row.append(label,del,field,pr,referenceArea(n));wrap.append(row)}}
function tool(v){mode=v;for(const id of ['tag','brush'])$(id).setAttribute('aria-pressed',id===v);$('help').textContent=v==='tag'?'クリックでタグを追加。番号をドラッグすると位置を調整できます。':'ドラッグして描き込みます。線を取り消すには「元に戻す」を押してください。'}
for(const id of ['tag','brush'])$(id).onclick=()=>tool(id);tool('tag');
function position(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(board.getScreenCTM().inverse());return [Math.round(Math.min(1000,Math.max(0,p.x))*10)/10,Math.round(Math.min(height,Math.max(0,p.y))*10)/10]}
function moveTag(n,p){const r=Math.min(13,height*.055)+1;n.x=Math.min(1000-r,Math.max(r,p[0]));n.y=Math.min(height-r,Math.max(r,p[1]))}
board.onpointerdown=e=>{if(e.button!==0||gesture)return;e.preventDefault();const p=position(e);board.setPointerCapture(e.pointerId);
 if(mode==='brush'){remember();const s={color:$('ink').value,width:+$('width').value,points:[p]};state.strokes.push(s);gesture={id:e.pointerId,s,node:stroke(s)};changed();return}
 const id=Number(e.target.closest('[data-id]')?.dataset.id);let n=state.notes.find(item=>item.id===id);if(!n){remember();n={id:Math.max(0,...state.notes.map(item=>item.id))+1,text:'',color:$('ink').value};moveTag(n,p);state.notes.push(n);changed()}selected=n.id;gesture={id:e.pointerId,n,original:p,moving:false};draw();list()};
board.onpointermove=e=>{if(!gesture||gesture.id!==e.pointerId)return;const p=position(e);if(gesture.s){gesture.s.points.push(p);gesture.node.remove();gesture.node=stroke(gesture.s)}else{if(!gesture.moving){if(Math.hypot(p[0]-gesture.original[0],p[1]-gesture.original[1])<2)return;remember();gesture.moving=true}moveTag(gesture.n,p);draw();changed()}};
board.onpointerup=board.onpointercancel=e=>{if(!gesture||gesture.id!==e.pointerId)return;const id=gesture.n?.id;gesture=null;draw();if(id&&e.type==='pointerup')$('note-'+id)?.focus()};
$('undo').onclick=()=>{if(!history.length||gesture)return;Object.assign(state,history.pop());$('undo').disabled=!history.length;changed();draw();list()};
$('zoom').onchange=()=>board.style.width=(100*Number($('zoom').value))+'%';
function read(f,method){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r[method](f)})}
function valid(s){const color=c=>/^#[a-f0-9]{6}$/i.test(c);return s&&typeof s.name==='string'&&/^data:image\/(png|jpe?g|gif|webp|bmp);base64,/i.test(s.image)&&Array.isArray(s.notes)&&Array.isArray(s.strokes)&&s.notes.every(n=>Number.isSafeInteger(n.id)&&n.id>0&&Number.isFinite(n.x)&&Number.isFinite(n.y)&&typeof n.text==='string'&&color(n.color)&&(n.references===undefined||Array.isArray(n.references)&&n.references.every(r=>r&&typeof r.name==="string"&&typeof r.src==="string"&&imageData.test(r.src))))&&new Set(s.notes.map(n=>n.id)).size===s.notes.length&&s.strokes.every(s=>color(s.color)&&[2,4,8].includes(s.width)&&Array.isArray(s.points)&&s.points.length&&s.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)))}
async function load(f,isProject){if(!f)return;try{let next;if(isProject){const data=JSON.parse(await f.text());if(data.version!==1||!valid(data.state))throw Error();next=data.state}else{const media=await importMedia(f);if(!media)return;next={name:media.name,image:media.src,notes:[],strokes:[]};if(!valid(next))throw Error()}
 const img=new Image();img.src=next.image;await img.decode();if(dirty&&!confirm('未保存の変更があります。別のファイルを開きますか？'))return;
 state=next;height=1000*img.naturalHeight/img.naturalWidth;history=[];dirty=false;gesture=null;selected=null;$('undo').disabled=true;board.setAttribute('viewBox','0 0 1000 '+height);board.removeAttribute('hidden');$('empty').hidden=true;$('zoom').value='1';$('zoom').onchange();$('pdf').disabled=$('save').disabled=false;$('printTitle').textContent='修正指示　'+state.name;document.title=state.name+' - ImageReview';$('status').textContent=state.name;draw();list()}catch{$('status').textContent='読み込めませんでした。画像、パスワード保護のないPDF、または保存したノートを選んでください。'}}
for(const [btn,input,project] of [['open','file',false],['restore','project',true]]){$(btn).onclick=()=>$(input).click();$(input).onchange=e=>{load(e.target.files[0],project);e.target.value=''}}
document.ondragover=e=>e.preventDefault();document.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)load(f,f.name.toLowerCase().endsWith('.json'))};
$('save').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,state})],{type:'application/json'}));a.href=url;a.download=state.name+'.review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);dirty=false;$('status').textContent='ノートを書き出しました'};
$('pdf').onclick=()=>window.print();window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
</script></html>
